<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container principal centralizado na tela -->
  <main class="app-container">
    
    <!-- Cabeçalho -->
    <header class="app-header">
      <h1>📝 Lista de Tarefas</h1>
      <p class="subtitle">Organize suas atividades diárias com facilidade</p>
    </header>

    <!-- Formulário para adicionar nova tarefa -->
    <form id="task-form" class="task-form">
      <input 
        type="text" 
        id="task-input" 
        placeholder="O que você precisa fazer hoje?" 
        autocomplete="off"
        required
      >
      <button type="submit" id="add-btn">Adicionar</button>
    </form>

    <!-- Resumo e contadores -->
    <section class="task-summary">
      <span id="task-count">0 tarefas no total</span>
      <span id="completed-count">0 concluídas</span>
    </section>

    <!-- Lista onde os itens serão adicionados dinamicamente via JavaScript -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Mensagem exibida caso não haja nenhuma tarefa cadastrada -->
    <div id="empty-state" class="empty-state">
      <p>🎉 Nenhuma tarefa por aqui! Adicione uma atividade acima.</p>
    </div>

  </main>

  <!-- Importação do arquivo de lógica em JavaScript -->
  <script src="script.js"></script>
</body>
</html>
